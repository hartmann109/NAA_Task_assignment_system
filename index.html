          <div class="card-body p-2">

            <ul class="list-group list-group-flush small" id="stats_lecturer">

            <h6 class="border-bottom pb-1 mt-3">🚩 導覽人員</h6>

      </div> </div> </div> <script>
    // 初始化：取得單號列表
    window.onload = function() {
      showLoading('系統初始化中...');
      google.script.run.withSuccessHandler(initPage).getInitialDataAPI();
    };

    // 初始化頁面
    function initPage(data) {
      const select = document.getElementById('orderSelect');
      select.innerHTML = '<option value="" disabled selected>請選擇單號</option>';
      data.orders.forEach(id => {
        select.innerHTML += `<option value="${id}">${id}</option>`;
      });

      window.staffOptions = data.staff;
      
      // 渲染統計資料
      updateStats(data.stats);

      Swal.close();
    }

    // 更新統計資料
    function updateStats(stats) {
      document.getElementById('stats_lecturer').innerHTML = stats.lecturer || '<li class="list-group-item">尚無資料</li>';
      document.getElementById('stats_guide').innerHTML = stats.guide || '<li class="list-group-item">尚無資料</li>';
      document.getElementById('stats_facilitator').innerHTML = stats.facilitator || '<li class="list-group-item">尚無資料</li>';
    }

    // 載入特定單號資料
    function loadOrderData() {
      const orderId = document.getElementById('orderSelect').value;
      if(!orderId) return;

      showLoading('讀取資料中...');
      google.script.run.withSuccessHandler(renderData).getOrderDataAPI(orderId);
    }

    // 渲染表單資料
    function renderData(data) {
      if(data.error) { 
        showError('讀取失敗', data.error); 
        return; 
      }

      // 填寫唯讀資訊
      document.getElementById('info_unit').value = data.applicant.unit;
      document.getElementById('info_date').value = data.applicant.date;
      document.getElementById('info_time').value = data.applicant.time;
      document.getElementById('info_people').value = data.applicant.count;
      document.getElementById('info_leader').value = data.applicant.leader;
      document.getElementById('info_phone').value = data.applicant.phone;
      document.getElementById('info_course').value = data.applicant.course;

      // 填寫下拉選單
      fillStaffSelects('lecturer', window.staffOptions.lecturer, data.work.lecturers);
      fillStaffSelects('guide', window.staffOptions.guide, data.work.guides);
      fillStaffSelects('facilitator', window.staffOptions.facilitator, data.work.facilitators);

      // 填寫其他欄位
      document.getElementById('promo_item').value = data.work.promo;
      document.getElementById('check_status').checked = data.work.checked;
      document.getElementById('extra_note').value = data.work.note;

      // 顯示主內容
      document.getElementById('mainContent').classList.remove('hidden');
      Swal.close(); // 關閉讀取視窗
    }

    // 輔助函式：填入人員選單
    function fillStaffSelects(type, options, currentValues) {
      for(let i=0; i<3; i++) {
        const select = document.getElementById(`${type}_${i}`);
        select.innerHTML = '';
        options.forEach(opt => {
          const isSelected = opt === currentValues[i] ? 'selected' : '';
          select.innerHTML += `<option value="${opt}" ${isSelected}>${opt}</option>`;
        });
      }
    }

    // 儲存資料
    function saveData() {
      const orderId = document.getElementById('orderSelect').value;
      
      // 收集表單資料
      const formData = {
        orderId: orderId,
        lecturers: [
          document.getElementById('lecturer_0').value,
          document.getElementById('lecturer_1').value,
          document.getElementById('lecturer_2').value
        ],
        guides: [
          document.getElementById('guide_0').value,
          document.getElementById('guide_1').value,
          document.getElementById('guide_2').value
        ],
        facilitators: [
          document.getElementById('facilitator_0').value,
          document.getElementById('facilitator_1').value,
          document.getElementById('facilitator_2').value
        ],
        promo: document.getElementById('promo_item').value,
        checked: document.getElementById('check_status').checked,
        note: document.getElementById('extra_note').value
      };

      showLoading('正在儲存配置...');

      google.script.run.withSuccessHandler(function(res){
        Swal.fire({
          icon: 'success',
          title: res.message, // 使用後端回傳的訊息
          text: '統計數據已同步更新',
          timer: 1500,
          showConfirmButton: false
        });
        
        // 更新畫面右側的統計欄
        if (res.newStats) {
           updateStats(res.newStats);
        }

      }).withFailureHandler(function(err){
        showError('儲存失敗', err.message);
      }).saveOrderDataAPI(formData);
    }

    // 執行後端動作 (漂亮的確認視窗)
    function runAction(actionName) {
      const orderId = document.getElementById('orderSelect').value;
      
      let actionTitle = '';
      let actionText = '';

      // 根據動作設定提示文字
      switch(actionName) {
        case 'notifyUser':
          actionTitle = '確定要通知申請人嗎？';
          actionText = '系統將會寄送受理通知信給申請單位。';
          break;
        case 'addToCalendar':
          actionTitle = '確定要加入行事曆嗎？';
          actionText = '將會把此行程寫入 Google Calendar。';
          break;
        case 'sendPDF':
          actionTitle = '確定要寄送工作通知嗎？';
          actionText = '這需要一點時間生成 PDF 並寄給所有工作人員。';
          break;
      }

      // 顯示確認對話框
      Swal.fire({
        title: actionTitle,
        text: actionText,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#3085d6', // 藍色按鈕
        cancelButtonColor: '#d33',    // 紅色按鈕
        confirmButtonText: '是的，執行！',
        cancelButtonText: '取消'
      }).then((result) => {
        if (result.isConfirmed) {
          // 使用者按下「確定」後才執行
          showLoading('正在處理請求，請稍候...');
          
          google.script.run.withSuccessHandler(function(res){
            Swal.fire(
              '執行完成！',
              res, // 後端回傳的文字
              'success'
            );
          }).withFailureHandler(function(err){
            showError('發生錯誤', err.message);
          }).runBackendActionAPI(actionName, orderId);
        }
      });
    }

    // 輔助函式：漂亮的讀取中
    function showLoading(text) {
      Swal.fire({
        title: text,
        allowOutsideClick: false,
        didOpen: () => {
          Swal.showLoading();
        }
      });
    }

    // 輔助函式：錯誤提示
    function showError(title, text) {
      Swal.fire({
        icon: 'error',
        title: title,
        text: text,
        confirmButtonText: '關閉'
      });
    }
  </script>
</body>
</html>
