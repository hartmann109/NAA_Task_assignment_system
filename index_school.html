<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <style>
    body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; color: #333; }
    .container { max-width: 1000px; margin-top: 20px; padding-bottom: 50px; }
    
    .system-logo {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
      margin: 0 auto 20px auto;
    }

    .section-card { border: 1px solid #ced4da; border-radius: 4px; margin-bottom: 20px; background-color: #fff; overflow: hidden; }
    .section-header { background-color: #5c636a; color: white; padding: 10px 15px; font-weight: bold; font-size: 1.1em; border-bottom: 1px solid #ced4da; }
    .section-body { padding: 20px; }

    .form-control[readonly] { background-color: #fff; color: #495057; border: 1px solid #ced4da; }
    .form-label { font-weight: bold; margin-bottom: 5px; color: #555; }

    option.status-closed { color: #aaa; font-style: italic; } 
    option.status-arranged { color: #198754; font-weight: bold; } 
    option.status-normal { color: #000; }

    /* 設定視窗樣式 */
    .nav-tabs .nav-link { color: #495057; cursor: pointer; }
    .nav-tabs .nav-link.active { font-weight: bold; color: #0d6efd; }
    .settings-list { max-height: 250px; overflow-y: auto; text-align: left; }
    .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    .settings-item:last-child { border-bottom: none; }

    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
    <span class="visually-hidden">Loading...</span>
  </div>
  <h5 class="text-secondary fw-bold" id="loadingText">系統同步與載入中...</h5>
</div>

<div class="container">
  
  <img src="https://hartmann109.github.io/NAA_Task_assignment_system/systemlogo_school.png" alt="System Logo" class="system-logo">
  
  <div class="section-card">
    <div class="section-header d-flex justify-content-between align-items-center">
      <span>步驟 1：選擇案件</span>
      <button class="btn btn-sm btn-outline-light d-flex align-items-center" onclick="manualSync()">
        <i class="material-icons fs-6 me-1">sync</i> 手動同步預約
      </button>
    </div>
    <div class="section-body">
      <div class="row">
        <div class="col-md-4 mb-3">
           <label class="form-label">1. 選擇年度：</label>
           <select class="form-select" id="yearSelect" onchange="renderOrderOptions()"></select>
        </div>
        <div class="col-md-8 mb-3">
          <label for="orderSelect" class="form-label">2. 選擇申請單號：</label>
          <select class="form-select" id="orderSelect" onchange="loadOrderDetails()">
            <option value="" selected disabled>請選擇一筆預約...</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="section-card" id="detailsArea" style="display: none;">
    <div class="section-header">申請資訊 (唯讀)</div>
    <div class="section-body">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">申請單位</label><input type="text" class="form-control" id="d_unit" readonly></div>
        <div class="col-md-3"><label class="form-label">參訪日期</label><input type="text" class="form-control" id="d_date" readonly></div>
        <div class="col-md-3"><label class="form-label">參訪時段</label><input type="text" class="form-control" id="d_timeSlot" readonly></div>
        <div class="col-md-2"><label class="form-label">人數</label><input type="text" class="form-control" id="d_count" readonly></div>
        <div class="col-md-4"><label class="form-label">授課對象/身分</label><input type="text" class="form-control" id="d_identity" readonly></div>
        <div class="col-md-3"><label class="form-label">聯絡人</label><input type="text" class="form-control" id="d_contact" readonly></div>
        <div class="col-md-3"><label class="form-label">聯絡電話</label><input type="text" class="form-control" id="d_phone" readonly></div>
        <div class="col-md-6"><label class="form-label">電子郵件</label><input type="text" class="form-control" id="d_email" readonly></div>
        <div class="col-md-6"><label class="form-label">送單時間</label><input type="text" class="form-control" id="d_submitTime" readonly></div>
        <div class="col-md-4"><label class="form-label">選擇方案</label><input type="text" class="form-control" id="d_course" readonly></div>
        <div class="col-md-8"><label class="form-label">課程名稱 / 內容</label><input type="text" class="form-control" id="d_content" readonly></div>
        <div class="col-12"><label class="form-label">申請人備註</label><textarea class="form-control" id="d_note" rows="3" readonly></textarea></div>
      </div>
      
      <hr class="my-4">

      <h5 class="mb-3 text-secondary">步驟 2：人員配置與管理</h5>
      <div class="bg-light p-4 rounded border">
        <div class="row g-3 align-items-center">
          <div class="col-md-5">
            <div class="input-group">
               <span class="input-group-text fw-bold text-secondary bg-white">指派人員</span>
               <select class="form-select" id="assignedPerson">
                  <option value="">未指派</option>
               </select>
               <button class="btn btn-outline-secondary" type="button" onclick="openSettings()" title="設定名單">
                 <i class="material-icons" style="font-size: 20px; vertical-align: middle;">settings</i>
               </button>
            </div>
          </div>
          <div class="col-md-4 d-flex align-items-center justify-content-center gap-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="checkCompleted">
              <label class="form-check-label" for="checkCompleted" style="cursor: pointer;">已完成配置</label>
            </div>
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="checkCancelled">
              <label class="form-check-label text-danger fw-bold" for="checkCancelled" style="cursor: pointer;">此案件已取消</label>
            </div>
          </div>
          <div class="col-md-3 text-end">
            <button class="btn btn-primary w-100" onclick="saveConfig()">
              <i class="material-icons align-middle fs-6">save</i> 儲存設定
            </button>
          </div>
        </div>
      </div>

      <hr class="my-4">

      <h5 class="mb-3 text-secondary">步驟 3：執行動作</h5>
      <div class="d-flex flex-wrap gap-3 justify-content-center">
        <button class="btn btn-success btn-lg px-4" onclick="actionNotifyAccept()">
            <i class="material-icons align-middle fs-5">email</i> 通知申請受理（給申請人）
        </button>
        <button class="btn btn-warning btn-lg text-dark px-4" onclick="actionAddToCalendar()">
            <i class="material-icons align-middle fs-5">event</i> 加入公務行事曆
        </button>
        <button class="btn btn-info btn-lg text-white px-4" onclick="actionNotifyWorker()">
            <i class="material-icons align-middle fs-5">assignment_ind</i> 寄送工作通知（給同仁）
        </button>
      </div>

    </div>
  </div>

  <div id="welcomeArea" class="text-center py-5 text-muted">
    <i class="material-icons" style="font-size: 64px; color: #ddd;">touch_app</i>
    <p class="mt-3">請由上方選單選擇一筆申請單開始作業</p>
  </div>

</div>

<script>
  var allData = [];
  var currentOrder = null;
  var personnelList = []; // [Name, Name...]
  var emailList = [];     // [{name, email}, ...]

  // ==========================================
  // 初始化與自動同步邏輯
  // ==========================================
  window.onload = function() {
    showLoading(true, "正在檢查是否有新預約...");
    
    // 1. 網頁開啟時，優先在背景執行一次同步
    google.script.run
      .withSuccessHandler(function(syncRes) {
        // 若有抓到新資料，跳出右下角 Toast 提示，不干擾使用者操作
        if(syncRes && syncRes.success && syncRes.count > 0) {
           Swal.fire({
             toast: true,
             position: 'bottom-end',
             icon: 'success',
             title: `自動同步完成：新增 ${syncRes.count} 筆預約`,
             showConfirmButton: false,
             timer: 3000
           });
        }
        // 2. 同步完成後，開始讀取資料並渲染畫面
        fetchAllSystemData();
      })
      .withFailureHandler(function(err) {
        console.error("自動同步失敗:", err);
        // 就算同步失敗，依然要讀取舊資料讓系統可用
        fetchAllSystemData();
      })
      .syncSchoolDataAPI();
  };

  var loadCount = 0;
  function checkLoadingComplete() {
    loadCount++;
    if(loadCount >= 2) showLoading(false);
  }

  function showLoading(show, text = "系統同步與載入中...") { 
    document.getElementById('loadingText').innerText = text;
    document.getElementById('loading').style.visibility = show ? 'visible' : 'hidden'; 
  }

  // 讀取所有系統資料 (在同步後呼叫)
  function fetchAllSystemData() {
    loadCount = 0;
    showLoading(true, "資料讀取中...");

    // 抓取預約清單
    google.script.run.withSuccessHandler(data => {
      allData = data;
      initYearSelect();
      checkLoadingComplete();
    }).getSchoolData();

    // 抓取人員設定選單
    google.script.run.withSuccessHandler(list => {
      personnelList = list;
      renderPersonnelOptions();
      checkLoadingComplete();
    }).getSchoolPersonnelList();

    // 背景抓取 Email 清單
    google.script.run.withSuccessHandler(list => {
      emailList = list;
    }).getEmailListData();
  }

  // ==========================================
  // 手動同步功能 (給按鈕使用)
  // ==========================================
  window.manualSync = function() {
    Swal.fire({
      title: '手動同步表單資料',
      text: '系統將從原始表單抓取新進預約，並自動依據時間重新排序。',
      icon: 'info',
      showCancelButton: true,
      confirmButtonText: '開始同步',
      cancelButtonText: '取消'
    }).then((result) => {
      if (result.isConfirmed) {
        showLoading(true, "同步中，請稍候...");
        google.script.run.withSuccessHandler(res => {
          if (res.success) {
            // 同步成功後，重新讀取一次最新資料
            google.script.run.withSuccessHandler(data => {
              allData = data;
              initYearSelect();
              showLoading(false);
              Swal.fire('同步完成', res.message, 'success');
              // 隱藏詳細資訊區塊，回到歡迎頁面
              document.getElementById('welcomeArea').style.display = 'block';
              document.getElementById('detailsArea').style.display = 'none';
            }).getSchoolData();
          } else {
            showLoading(false);
            Swal.fire('同步失敗', res.message, 'error');
          }
        }).syncSchoolDataAPI();
      }
    });
  }

  // ==========================================
  // 畫面渲染與邏輯
  // ==========================================
  function initYearSelect() {
    var yearSet = new Set();
    allData.forEach(item => { var y = item.date.toString().substring(0, 4); if(y) yearSet.add(y); });
    var years = Array.from(yearSet).sort().reverse();
    var select = document.getElementById('yearSelect');
    select.innerHTML = '';
    if (years.length === 0) select.add(new Option(new Date().getFullYear() + " 年", new Date().getFullYear()));
    else years.forEach(y => select.add(new Option(y + " 年", y)));
    renderOrderOptions();
  }

  function renderOrderOptions() {
    var select = document.getElementById('orderSelect');
    select.innerHTML = '<option value="" selected disabled>請選擇一筆預約...</option>';
    var selectedYear = document.getElementById('yearSelect').value;
    var today = new Date(); today.setHours(0,0,0,0);
    
    allData.forEach(function(item) {
      if (item.date.toString().substring(0, 4) !== selectedYear) return;
      var eventDate = new Date(item.date);
      var label = item.id + " (" + item.date + ")";
      var className = "status-normal";
      if (item.isCancelled) { label = item.id + " (已取消)"; className = "status-closed"; }
      else if (eventDate < today) { label = item.id + " (已結案)"; className = "status-closed"; }
      else if (item.assignedTo) { label = item.id + " (已安排)"; className = "status-arranged"; }
      
      var option = document.createElement('option');
      option.value = item.id; option.text = label; option.className = className;
      select.add(option);
    });
  }

  function renderPersonnelOptions() {
    var select = document.getElementById('assignedPerson');
    var currentVal = select.value;
    select.innerHTML = '<option value="">未指派</option>';
    personnelList.forEach(function(name) {
      var opt = document.createElement('option');
      opt.value = name; opt.text = name;
      select.add(opt);
    });
    if(currentVal) select.value = currentVal;
  }

  function loadOrderDetails() {
    var id = document.getElementById('orderSelect').value;
    currentOrder = allData.find(d => d.id == id);
    if (!currentOrder) return;
    document.getElementById('welcomeArea').style.display = 'none';
    document.getElementById('detailsArea').style.display = 'block';

    var fields = ['d_unit', 'd_date', 'd_timeSlot', 'd_count', 'd_identity', 'd_contact', 'd_phone', 'd_email', 'd_submitTime', 'd_course', 'd_content', 'd_note'];
    var keys = ['unit', 'date', 'timeSlot', 'count', 'identity', 'contact', 'phone', 'email', 'submitTime', 'course', 'content', 'note'];
    fields.forEach((f, i) => document.getElementById(f).value = currentOrder[keys[i]] || '');

    document.getElementById('assignedPerson').value = currentOrder.assignedTo || "";
    document.getElementById('checkCompleted').checked = !!currentOrder.isCompleted;
    document.getElementById('checkCancelled').checked = !!currentOrder.isCancelled;
  }

  function saveConfig() {
    if(!currentOrder) return;
    showLoading(true, "儲存設定中...");
    var assigned = document.getElementById('assignedPerson').value;
    var completed = document.getElementById('checkCompleted').checked;
    var cancelled = document.getElementById('checkCancelled').checked;
    
    currentOrder.assignedTo = assigned;
    currentOrder.isCompleted = completed;
    currentOrder.isCancelled = cancelled;

    google.script.run.withSuccessHandler(function(res) {
      showLoading(false);
      renderOrderOptions();
      document.getElementById('orderSelect').value = currentOrder.id;
      if(res.success) Swal.fire('成功', res.message, 'success');
      else Swal.fire('錯誤', res.message, 'error');
    }).saveSchoolConfig(currentOrder.id, assigned, cancelled, completed);
  }

  /* ==========================================
     動作按鈕 
     ========================================== */
  function actionNotifyAccept() {
    Swal.fire({ title: '確認發送', text: '將通知申請人已受理', icon: 'question', showCancelButton: true, confirmButtonText: '發送', cancelButtonText: '取消' }).then(r => {
      if(r.isConfirmed) {
        showLoading(true, "寄送中...");
        google.script.run.withSuccessHandler(res => { showLoading(false); Swal.fire(res.success?'成功':'失敗', res.message, res.success?'success':'error'); }).sendSchoolAcceptanceEmail(currentOrder);
      }
    });
  }
  function actionAddToCalendar() {
    Swal.fire({ title: '確認加入', text: '加入至公務行事曆', icon: 'question', showCancelButton: true, confirmButtonText: '加入', cancelButtonText: '取消' }).then(r => {
      if(r.isConfirmed) {
        showLoading(true, "處理中...");
        google.script.run.withSuccessHandler(res => { showLoading(false); Swal.fire(res.success?'成功':'失敗', res.message, res.success?'success':'error'); }).addSchoolCalendarEvent(currentOrder);
      }
    });
  }
  function actionNotifyWorker() {
    var assigned = document.getElementById('assignedPerson').value;
    if(!assigned) { Swal.fire('錯誤', '請先選擇指派人員', 'warning'); return; }
    Swal.fire({ title: '確認發送', text: '將寄信給同仁：' + assigned, icon: 'question', showCancelButton: true, confirmButtonText: '發送', cancelButtonText: '取消' }).then(r => {
      if(r.isConfirmed) {
        saveConfig(); 
        showLoading(true, "寄送中...");
        google.script.run.withSuccessHandler(res => { showLoading(false); Swal.fire(res.success?'成功':'失敗', res.message, res.success?'success':'error'); }).sendSchoolWorkNotification(currentOrder);
      }
    });
  }

  /* ==========================================
     設定視窗 (支援分頁)
     ========================================== */
  function openSettings() {
    showLoading(true, "讀取設定中...");
    google.script.run.withSuccessHandler(pList => {
      personnelList = pList;
      google.script.run.withSuccessHandler(eList => {
        emailList = eList;
        showLoading(false);
        renderSettingsModal(); 
      }).getEmailListData();
    }).getSchoolPersonnelList();
  }

  function renderSettingsModal() {
    var html = `
      <ul class="nav nav-tabs mb-3" id="settingTabs">
        <li class="nav-item"><a class="nav-link active" onclick="switchTab('personnel')">人員名單配置</a></li>
        <li class="nav-item"><a class="nav-link" onclick="switchTab('email')">Email 寄送清單</a></li>
      </ul>

      <div id="tab-personnel">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="newPersonName" placeholder="輸入姓名新增到下拉選單">
          <button class="btn btn-primary" onclick="addPerson()">新增</button>
        </div>
        <div class="settings-list border rounded">
          ${personnelList.map(p => `
            <div class="settings-item">
              <span>${p}</span>
              <button class="btn btn-sm btn-outline-danger" onclick="delPerson('${p}')">刪除</button>
            </div>`).join('')}
        </div>
        <div class="text-muted small mt-2 text-start">* 此名單用於「指派接待人員」的下拉選項 (資料來源：人員配置表 D 欄)</div>
      </div>

      <div id="tab-email" style="display:none;">
        <div class="input-group mb-3">
          <input type="text" class="form-control" id="newEmailName" placeholder="姓名">
          <input type="text" class="form-control" id="newEmailAddr" placeholder="Email">
          <button class="btn btn-primary" onclick="addEmail()">新增</button>
        </div>
        <div class="settings-list border rounded">
          ${emailList.map(e => `
            <div class="settings-item">
              <div><strong>${e.name}</strong> <small class="text-muted">(${e.email})</small></div>
              <button class="btn btn-sm btn-outline-danger" onclick="delEmail('${e.email}')">刪除</button>
            </div>`).join('')}
        </div>
        <div class="text-muted small mt-2 text-start">* 此清單用於「寄送工作通知」時查找信箱 (資料來源：電子郵件寄送清單)</div>
      </div>
    `;

    Swal.fire({
      title: '系統資料管理',
      html: html,
      width: '600px',
      showConfirmButton: false,
      showCloseButton: true,
      didOpen: () => {
        window.switchTab = function(tab) {
          document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
          event.target.classList.add('active');
          document.getElementById('tab-personnel').style.display = tab === 'personnel' ? 'block' : 'none';
          document.getElementById('tab-email').style.display = tab === 'email' ? 'block' : 'none';
        }
      }
    });
  }

  window.addPerson = function() {
    var name = document.getElementById('newPersonName').value;
    if(!name) return;
    showLoading(true, "處理中...");
    google.script.run.withSuccessHandler(() => { 
      openSettings(); 
      renderPersonnelOptions(); 
    }).addSchoolPerson(name);
  }
  
  window.delPerson = function(name) {
    Swal.fire({ title: '刪除人員', text: name, icon: 'warning', showCancelButton: true, confirmButtonText: '刪除', cancelButtonText: '取消' }).then(r => {
      if(r.isConfirmed) {
         showLoading(true, "處理中...");
         google.script.run.withSuccessHandler(() => { 
           openSettings(); 
           renderPersonnelOptions(); 
         }).removeSchoolPerson(name);
      } else { openSettings(); }
    });
  }

  window.addEmail = function() {
    var name = document.getElementById('newEmailName').value;
    var email = document.getElementById('newEmailAddr').value;
    if(!name || !email) return;
    showLoading(true, "處理中...");
    google.script.run.withSuccessHandler(() => { 
      openSettings(); 
    }).addEmailPerson(name, email);
  }

  window.delEmail = function(email) {
    Swal.fire({ title: '刪除 Email', text: email, icon: 'warning', showCancelButton: true, confirmButtonText: '刪除', cancelButtonText: '取消' }).then(r => {
      if(r.isConfirmed) {
         showLoading(true, "處理中...");
         google.script.run.withSuccessHandler(() => { openSettings(); }).removeEmailPerson(email);
      } else { openSettings(); }
    });
  }

</script>

</body>
</html>
